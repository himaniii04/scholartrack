<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScholarTrack | React + Flask</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1838;--indigo:#2a3a96;--gold:#f6b93b;--mint:#2fcf9f;--bad:#e5484d;--paper:#f7f8fd;--mut:#667091;--line:#e3e6f2}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#0a1230;line-height:1.55;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#0a1230,#13236b 55%,#0a1230)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:420px;height:420px;background:#f6b93b;top:-120px;right:-80px;opacity:.28}
.bg i:nth-child(2){width:520px;height:520px;background:#4f63e6;left:-160px;top:25%;animation-delay:-5s}
.bg i:nth-child(3){width:380px;height:380px;background:#2fcf9f;right:10%;bottom:-140px;opacity:.22;animation-delay:-9s}
@keyframes drift{to{transform:translate(50px,-40px) scale(1.12)}}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:26px 26px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.3rem;padding:.9rem 5vw;position:sticky;top:0;z-index:8;background:rgba(10,18,48,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1)}
.logo{font:700 1.4rem Fraunces,serif;color:#fff;cursor:pointer;margin-right:auto}.logo span{color:var(--gold)}
header a{color:#cfd6f5;cursor:pointer;font-weight:600;font-size:.93rem;padding:.2rem .1rem;border-bottom:2px solid transparent;transition:.15s}
header a:hover,header a.on{color:var(--gold);border-color:var(--gold)}
main{max-width:1060px;margin:0 auto;padding:2rem 1.2rem 4rem;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pt{color:#fff;font-size:2.1rem;margin-bottom:.4rem}.sub{color:#b9c2ea;margin-bottom:1.1rem}
.card{background:var(--paper);border-radius:20px;padding:1.4rem 1.6rem;margin-bottom:1.1rem;box-shadow:0 26px 50px -30px rgba(0,0,0,.75);position:relative}
.card.glass{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1rem}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}
label{display:block;font-weight:700;font-size:.86rem;margin:.8rem 0 .25rem}
input,select,textarea{width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s}
input[type=range]{padding:0;accent-color:var(--indigo)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--indigo)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font-family:inherit}
.btn{background:linear-gradient(135deg,var(--gold),#f08a24);color:#2a1a00;border:0;border-radius:999px;padding:.75rem 1.5rem;font-weight:800;font-size:1rem;cursor:pointer;margin-top:1rem;box-shadow:0 10px 24px -10px rgba(246,185,59,.9);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(246,185,59,1)}.btn:active{transform:scale(.94)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.alt{background:#fff;color:var(--indigo);border:1.5px solid var(--indigo);box-shadow:none}.btn.alt:hover{background:var(--indigo);color:#fff}
.btn.red{background:var(--bad);color:#fff;box-shadow:none}.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}.btn.sm{padding:.42rem .95rem;font-size:.84rem;margin:0}
.chip{padding:.4rem .95rem;border-radius:99px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:700;font-size:.84rem;color:var(--mut);transition:.15s}
.chip:hover{border-color:var(--indigo);transform:translateY(-1px)}.chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.tabs{display:flex;gap:.5rem;margin:.8rem 0 1.2rem;flex-wrap:wrap}.tabs .chip{background:rgba(255,255,255,.1);color:#dfe4ff;border-color:transparent}.tabs .chip.on{background:var(--gold);color:#2a1a00}
.heart{background:none;border:0;font-size:1.4rem;cursor:pointer;transition:transform .15s}.heart:hover{transform:scale(1.3)}.heart:active{transform:scale(.8)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:center;padding:1.5rem 0 3rem}
.hero h1{color:#fff;font-size:clamp(2.3rem,5vw,3.6rem)}.hero p{color:#c3cbef;font-size:1.1rem;margin:1rem 0;max-width:46ch}
.stage{position:relative;padding:1.2rem 0}
.mock{background:#fff;border-radius:22px;padding:1.4rem;box-shadow:0 40px 70px -30px #000;position:relative}
.fl{position:absolute;background:#fff;border-radius:14px;padding:.45rem .9rem;font-weight:800;font-size:.85rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:flt 5s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-12px)}}
.stats{display:flex;gap:2rem;margin-top:1.6rem;color:#fff;flex-wrap:wrap}.stats b{display:block;font:700 1.9rem Fraunces,serif;color:var(--gold)}.stats small{color:#b9c2ea}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;flex:none}
.lift{cursor:pointer;transition:transform .2s,box-shadow .2s}.lift:hover{transform:translateY(-6px)}
.steps{counter-reset:s}.steps .card{padding-top:2.2rem}.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:1.2rem;background:var(--gold);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.chk{list-style:none;padding:0;margin:.6rem 0}.chk li{padding:.15rem 0}.chk li::before{font-weight:800;margin-right:.5rem}.chk .p::before{content:"✓";color:var(--mint)}.chk .f::before{content:"✗";color:var(--bad)}
.badge{display:inline-block;padding:.15rem .7rem;border-radius:99px;font-size:.78rem;font-weight:800;background:#e9ecf8;color:var(--indigo);white-space:nowrap}
.badge.ok,.badge.Approved,.badge.Active{background:#d9f6ec;color:#0c8a63}.badge.Rejected,.badge.Closed,.badge.Blocked,.badge.urgent{background:#fde4e5;color:#c0282d}.badge.Submitted,.badge.UnderReview{background:#fff0cc;color:#8a5a00}
.hit{border-left:6px solid var(--mint)}.miss{border-left:6px solid var(--line)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.sp{margin-right:auto}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:.5rem}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mint));transition:width .4s}
.stp{display:flex;align-items:center;margin:.7rem 0 .2rem}.stp b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:.8rem;color:var(--mut);transition:.3s}.stp b.d{background:var(--mint);color:#fff}.stp b.x{background:var(--bad);color:#fff}.stp s{flex:1;height:3px;background:var(--line);text-decoration:none}.stp s.d{background:var(--mint)}
table{width:100%;border-collapse:collapse;font-size:.93rem}th{text-align:left;color:var(--mut);font-size:.82rem}td,th{padding:.6rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr:hover{background:#eef0fb}
.tw{overflow-x:auto}
.mut{color:var(--mut)}.note{font-size:.84rem;color:var(--mut);margin-top:.4rem}.num{font:700 2.1rem Fraunces,serif;color:var(--indigo)}
.seg{display:flex;background:#e9ecf8;border-radius:99px;padding:4px;gap:4px}.seg button{flex:1;border:0;padding:.5rem;border-radius:99px;background:none;font-weight:800;cursor:pointer;color:var(--mut);transition:.15s}.seg .on{background:#fff;color:var(--indigo);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mbg{position:fixed;inset:0;background:rgba(5,10,30,.75);display:grid;place-items:center;z-index:20;padding:1rem;overflow:auto}.modal{background:#fff;border-radius:20px;padding:1.6rem;max-width:480px;width:100%;animation:in .2s}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;padding:.8rem 1.4rem;border-radius:14px;font-weight:800;box-shadow:0 14px 40px rgba(0,0,0,.4);z-index:30;animation:in .25s}
.banner{background:#fff0cc;color:#5c3d00;padding:.8rem 1.2rem;font-weight:700;text-align:center}
.lnk{color:var(--indigo);font-weight:800;cursor:pointer;background:none;border:0;font-size:inherit;text-decoration:underline;text-align:left}
.back{color:#cfd6f5;background:none;border:0;cursor:pointer;font-size:1rem}.back:hover{color:var(--gold)}
.bell{position:relative;background:rgba(255,255,255,.12);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.05rem}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .4rem}
.drop{position:absolute;right:0;top:46px;width:310px;background:#fff;border-radius:16px;padding:1rem;box-shadow:0 20px 50px rgba(0,0,0,.5);color:var(--ink)}
.drop p{padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.9rem}.drop p.u{font-weight:800}
.faq{border-bottom:1px solid rgba(255,255,255,.15)}.faq button{width:100%;text-align:left;background:none;border:0;color:#fff;font-weight:800;font-size:1.02rem;padding:1rem 0;cursor:pointer;display:flex;justify-content:space-between}
.faq p{color:#c3cbef;padding-bottom:1rem}
.catg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem}
.catg .card{text-align:center;padding:1.1rem;margin:0}.catg .tile{margin:0 auto .5rem}
@media(max-width:760px){.hero{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useMemo,useContext,createContext,useEffect}=React;
const Ctx=createContext();const useC=()=>useContext(Ctx);

/* ================= talking to the Flask backend ================= */
/* api() = the "waiter call": send a request to Flask, get JSON back. */
async function api(url,method='GET',body){
 const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error((d&&d.error)||'Something went wrong');
 return d;
}

/* ================= helpers ================= */
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const days=d=>Math.ceil((new Date(d)-new Date())/864e5);
const any=(v,x)=>String(v).toLowerCase()==='any'||String(v).toLowerCase()===String(x).trim().toLowerCase();
/* same 5 rules as the Python check_eligibility() (used on Dashboard + Detail; the Finder asks the server) */
function check(c,f){const k=[[`Marks: you have ${f.pct}%, needs ${c.pct}%+`,+f.pct>=c.pct],[`Income: ${inr(f.inc)} (limit ${inr(c.inc)})`,+f.inc<=c.inc],[`Course: ${c.course}`,any(c.course,f.course)],[`Year: ${c.year}`,any(c.year,f.year)],[`State: ${c.state}`,any(c.state,f.state)]];return{k,ok:k.every(x=>x[1]),n:k.filter(x=>x[1]).length}}
const COL={Merit:['#fff0cc','#f6b93b'],'Need-based':['#d9f6ec','#2fcf9f'],Women:['#fde4f0','#e75fa5'],Research:['#e3e9ff','#4f63e6'],Government:['#e8e8f2','#6b6f8d']};
const ICO={Merit:'🏆','Need-based':'🤝',Women:'👩‍💻',Research:'🔬',Government:'🏛️'};
const tileSt=c=>({background:`linear-gradient(135deg,${(COL[c]||['#e9ecf8'])[0]},#fff)`,boxShadow:`inset 0 0 0 2px ${(COL[c]||['','#2a3a96'])[1]}55`});
const Tile=({c})=><div className="tile" style={tileSt(c)}>{ICO[c]||'🎓'}</div>;
const Badge=({s,ok})=><span className={'badge '+(ok?'ok':String(s).replace(' ',''))}>{s}</span>;
const Checks=({k})=><ul className="chk">{k.map((x,i)=><li key={i} className={x[1]?'p':'f'}>{x[0]}</li>)}</ul>;
const Field=({l,...p})=><div><label>{l}</label><input {...p}/></div>;
const Tabs=({v,set,items})=><div className="tabs">{items.map(([k,t])=><button key={k} className={'chip '+(v==k?'on':'')} onClick={()=>set(k)}>{t}</button>)}</div>;
const Count=({n})=>{const [x,setX]=useState(0);useEffect(()=>{let st=null,id;const f=t=>{st=st||t;const p=Math.min((t-st)/700,1);setX(Math.round(n*p));if(p<1)id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)},[n]);return <>{x}</>};
const Ring=({v,size=70})=>{const r=size/2-7,c=2*Math.PI*r;return <svg width={size} height={size} role="img" aria-label={Math.round(v)+'%'}><circle cx={size/2} cy={size/2} r={r} stroke="#e3e6f2" strokeWidth="7" fill="none"/><circle cx={size/2} cy={size/2} r={r} stroke={v>=100?'#2fcf9f':'#f6b93b'} strokeWidth="7" fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-v/100)} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .6s'}}/><text x="50%" y="54%" textAnchor="middle" fontSize={size/4.2} fontWeight="800" fill="#0d1838">{Math.round(v)}%</text></svg>};
const Bars=({data})=>{const m=Math.max(1,...data.map(d=>d[1]));return <div>{data.map(([k,n,c])=><div key={k} className="row" style={{margin:'.45rem 0',flexWrap:'nowrap'}}><span style={{width:105,fontSize:'.85rem'}}>{k}</span><div className="bar" style={{flex:1,height:12,margin:0}}><i style={{width:n/m*100+'%',background:c}}/></div><b>{n}</b></div>)}</div>};
const Search=({v,set,ph})=><input style={{maxWidth:280}} placeholder={ph||'Search...'} value={v} onChange={e=>set(e.target.value)} aria-label="Search"/>;
/* reminders are the only thing kept in the browser */
function useLocal(k,init){const [v,setV]=useState(()=>{try{const s=localStorage.getItem('stk_'+k);return s?JSON.parse(s):init}catch(e){return init}});
 return [v,x=>setV(p=>{const n=typeof x=='function'?x(p):x;try{localStorage.setItem('stk_'+k,JSON.stringify(n))}catch(e){}return n})]}

/* ================= App: loads data from Flask and shares it ================= */
function App(){
 const [v,setV]=useState({n:'home'}),[user,setUser]=useState(undefined),[S,setS]=useState([]),[A,setA]=useState([]),[SV,setSV]=useState([]),[U,setU]=useState([]),[P,setP]=useState({}),[C,setC]=useState([]),[N,setN]=useState([]),[stats,setStats]=useState(null),[R,setR]=useLocal('R',[]);
 const [toast,setToast]=useState(''),[modal,setModal]=useState(null),[down,setDown]=useState(false);
 const go=(n,a)=>{setV({n,a});scrollTo(0,0)};
 const say=t=>{setToast(t);setTimeout(()=>setToast(''),2300)};
 /* reload(): ask Flask for fresh data (what each role needs) */
 const reload=async u=>{u=u===undefined?user:u;
  try{const [s,c]=await Promise.all([api('/api/scholarships'),api('/api/categories')]);setS(s);setC(c);
   if(!u)return;
   if(u.role=='student'){const [p,sv,a,n]=await Promise.all([api('/api/profile'),api('/api/saved'),api('/api/applications'),api('/api/notifications')]);setP(p);setSV(sv);setA(a);setN(n)}
   else if(u.role=='provider'){setA(await api('/api/applications'))}
   else{const [a,us,st]=await Promise.all([api('/api/applications'),api('/api/admin/users'),api('/api/admin/stats')]);setA(a);setU(us);setStats(st)}
  }catch(e){say(e.message)}};
 useEffect(()=>{api('/api/me').then(async u=>{await reload(u);setUser(u)}).catch(()=>{setDown(true);setUser(null)})},[]);
 /* act(): do something on the server, then refresh the screen */
 const act=async(fn,msg)=>{try{await fn();await reload();if(msg)say(msg);return true}catch(e){say(e.message);return false}};
 const stu=()=>{if(user&&user.role=='student')return true;say('Log in as a student first');go('login');return false};
 const X={v,go,user,S,A,SV,U,P,C,N,R,stats,say,act,reload,ask:setModal,
  enter:async(u,isNew)=>{await reload(u);setUser(u);say(isNew?'Account created 🎉':'Welcome back, '+u.name);go(u.role=='student'?(isNew?'profile':'dash'):u.role=='provider'?'prov':'admin')},
  logout:async()=>{try{await api('/api/logout','POST')}catch(e){}setUser(null);setA([]);setSV([]);setN([]);setP({});go('home')},
  toggleSave:id=>{if(stu())act(()=>api('/api/saved/'+id,'POST'),SV.includes(id)?'Removed from saved':'Saved for later ❤️')},
  toggleRemind:id=>{if(!stu())return;setR(r=>r.includes(id)?r.filter(x=>x!=id):[...r,id]);say(R.includes(id)?'Reminder removed':'Reminder set ⏰')},
  apply:id=>{if(stu())act(()=>api('/api/applications','POST',{scholarship_id:id}),'Application recorded 🎉')},
  setStatus:(id,st)=>act(()=>api('/api/applications/'+id+'/status','PUT',{status:st}),'Status set to '+st)};
 const Page={home:Home,register:Auth,login:Auth,dash:Dash,profile:Profile,finder:Finder,detail:Detail,apps:Apps,prov:Provider,admin:Admin}[v.n];
 return <Ctx.Provider value={X}>
  {location.protocol=='file:'&&<div className="banner">You opened this file directly. Open http://127.0.0.1:5000 in the browser instead (with python app.py running).</div>}
  {down&&<div className="banner">Cannot reach the backend. Is `python app.py` still running in the terminal?</div>}
  <Nav/>{user===undefined?<main><p className="sub">Loading...</p></main>:<main key={v.n+(v.a&&v.a.id||v.a||'')}><Page/></main>}
  {toast&&<div className="toast" role="status">{toast}</div>}
  {modal&&<div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
   <h3>{modal.title}</h3><div style={{margin:'.8rem 0'}}>{modal.body}</div>
   <div className="row" style={{justifyContent:'flex-end'}}><button className="btn alt sm" onClick={()=>setModal(null)}>{modal.onOk?'Cancel':'Close'}</button>
   {modal.onOk&&<button className={'btn sm '+(modal.danger?'red':'')} onClick={()=>{modal.onOk();setModal(null)}}>{modal.ok||'Confirm'}</button>}</div></div></div>}
 </Ctx.Provider>;
}

function Nav(){
 const {v,go,user,logout,N,reload}=useC();const [open,setOpen]=useState(false);const un=N.filter(x=>!x.read).length;
 const L=!user?[['finder','Browse'],['login','Log in'],['register','Register']]:user.role=='student'?[['dash','Dashboard'],['finder','Find scholarships'],['apps','My applications'],['profile','Profile']]:user.role=='provider'?[['prov','Provider dashboard']]:[['admin','Admin panel']];
 return <header><div className="logo" onClick={()=>go(user?(user.role=='student'?'dash':user.role=='provider'?'prov':'admin'):'home')}>🎓 Scholar<span>Track</span></div>
  {L.map(([k,t])=><a key={k} className={v.n==k?'on':''} onClick={()=>go(k)}>{t}</a>)}
  {user&&user.role=='student'&&<div style={{position:'relative'}}><button className="bell" aria-label="Notifications" onClick={()=>{if(open)api('/api/notifications/read','POST').then(()=>reload());setOpen(!open)}}>🔔{un>0&&<b>{un}</b>}</button>
   {open&&<div className="drop"><b>Notifications</b>{N.length?N.slice(0,6).map(x=><p key={x.id} className={x.read?'':'u'}>{x.t}</p>):<p className="mut">Nothing new.</p>}</div>}</div>}
  {user&&<a onClick={logout}>Log out ({user.name})</a>}</header>;
}

/* ================= Home ================= */
function LiveDemo(){
 const [m,setM]=useState(82),[i,setI]=useState(250000);const r=check({pct:70,inc:300000,course:'Any',year:'Any',state:'Any'},{pct:m,inc:i,course:'x',year:1,state:'x'});
 return <div className="mock"><div className="row"><h3 className="sp">ABC Education Scholarship</h3><span className={'badge '+(r.ok?'ok':'')}>{r.ok?'Potentially eligible':'May not match'}</span></div>
  <p className="mut">{inr(50000)} · needs 70%+ and income up to {inr(300000)}</p>
  <label>Your marks: {m}%</label><input type="range" min="40" max="100" value={m} onChange={e=>setM(+e.target.value)} aria-label="Marks"/>
  <label>Family income: {inr(i)}</label><input type="range" min="0" max="800000" step="10000" value={i} onChange={e=>setI(+e.target.value)} aria-label="Income"/>
  <ul className="chk"><li className={r.k[0][1]?'p':'f'}>Percentage requirement</li><li className={r.k[1][1]?'p':'f'}>Income requirement</li></ul><p className="note">Drag the sliders. This is how the real finder works.</p></div>;
}
function Home(){
 const {go,user,S,C}=useC();const [open,setOpen]=useState(0);
 const F=[['Is "potentially eligible" a guarantee?','No. It only compares your details with the rules. The provider makes the final decision.'],['Do providers see my data?','Only when you record an application, and only the details needed to review it.'],['Is ScholarTrack free?','Yes for students. Providers can list scholarships at no cost.']];
 return <>

 {t=='list'&&(mine.length?mine.map(x=><div className="card" key={x.id}><div className="row"><Tile c={x.cat}/><div className="sp"><h3>{x.name}</h3><span className="mut">{inr(x.amt)} · {x.dl} · {x.cat}</span></div><Badge s={x.st}/></div>
  <div className="row" style={{marginTop:'.8rem'}}><button className="btn sm" onClick={()=>{setSel(x.id);setT('apps')}}>{A.filter(a=>a.sid==x.id).length} applicants</button><button className="btn alt sm" onClick={()=>startEdit(x)}>Edit</button>
   <button className="btn alt sm" onClick={()=>act(()=>api('/api/scholarships','POST',{name:x.name+' (copy)',desc:x.desc,amt:x.amt,dl:x.dl,cat:x.cat,link:x.link,c:x.c,docs:x.docs}),'Duplicated')}>Duplicate</button>
   <button className="btn alt sm" onClick={()=>act(()=>api('/api/scholarships/'+x.id+'/toggle','POST'),'Status changed')}>{x.st=='Active'?'Close':'Reopen'}</button>
   <button className="btn red sm" onClick={()=>ask({title:'Delete scholarship?',danger:1,ok:'Delete',body:<p>"{x.name}" and its criteria will be removed.</p>,onOk:()=>act(()=>api('/api/scholarships/'+x.id,'DELETE'),'Deleted')})}>Delete</button></div></div>):<div className="card"><p>You haven't added a scholarship yet.</p><button className="btn sm" style={{marginTop:'.7rem'}} onClick={()=>setT('form')}>Add your first</button></div>)}
 {t=='apps'&&<div className="card"><div className="row"><select style={{width:'auto'}} value={sel} onChange={e=>setSel(e.target.value)} aria-label="Scholarship"><option value="">All my scholarships</option>{mine.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select><Search v={q} set={setQ} ph="Search student..."/></div>
  <div className="row" style={{margin:'.9rem 0'}}>{['All','Submitted','Under Review','Approved','Rejected'].map(x=><button key={x} className={'chip '+(flt==x?'on':'')} onClick={()=>setFlt(x)}>{x}</button>)}</div>
  {rows.length?<div className="tw"><table><thead><tr><th>Student</th><th>College</th><th>%</th><th>Income</th><th>Status</th><th>Decide</th></tr></thead><tbody>{rows.map(a=><tr key={a.id}><td><button className="lnk" onClick={()=>ask({title:a.who,body:<div><p>College: {a.col}</p><p>Percentage: {a.pct}%</p><p>Family income: {inr(a.inc)}</p><p>Applied: {a.date}</p></div>})}>{a.who}</button></td><td>{a.col}</td><td>{a.pct}</td><td>{inr(a.inc)}</td><td><Badge s={a.status}/></td>
   <td><div className="row"><button className="btn alt sm" onClick={()=>setStatus(a.id,'Under Review')}>Review</button><button className="btn sm" onClick={()=>setStatus(a.id,'Approved')}>Approve</button><button className="btn red sm" onClick={()=>setStatus(a.id,'Rejected')}>Reject</button></div></td></tr>)}</tbody></table></div>:<p className="mut">No applicants match.</p>}</div>}
 {t=='form'&&<div className="g2"><form className="card" onSubmit={save}>
  <Field l="Scholarship name" required value={f.name} onChange={s('name')}/><label>Description</label><textarea rows="2" value={f.desc} onChange={s('desc')}/>
  <div className="grid"><Field l="Amount (₹)" type="number" required value={f.amt} onChange={s('amt')}/><Field l="Deadline" type="date" required value={f.dl} onChange={s('dl')}/><div><label>Category</label><select value={f.cat} onChange={s('cat')}>{C.map(c=><option key={c}>{c}</option>)}</select></div></div>
  <h3 style={{marginTop:'1.2rem'}}>Who can apply</h3><div className="grid"><Field l="Minimum %" type="number" value={f.pct} onChange={s('pct')}/><Field l="Max family income (₹)" type="number" required value={f.inc} onChange={s('inc')}/><Field l="Course" value={f.course} onChange={s('course')}/><Field l="Year" value={f.year} onChange={s('year')}/><Field l="State" value={f.state} onChange={s('state')}/></div>
  <h3 style={{marginTop:'1.2rem'}}>Documents</h3><label>Required (one per line)</label><textarea rows="3" value={f.req} onChange={s('req')}/><label>Optional (one per line)</label><textarea rows="2" value={f.opt} onChange={s('opt')}/>
  <div className="row"><button className="btn">{edit?'Save changes':'Publish scholarship'}</button><button type="button" className="btn alt" onClick={()=>{setF(blank);setEdit(null)}}>Clear</button></div></form>
  <div><h3 style={{color:'#fff',marginBottom:'.7rem'}}>Live preview</h3><div className="card hit"><div className="row" style={{flexWrap:'nowrap'}}><Tile c={f.cat}/><div className="sp"><h3>{f.name||'Scholarship name'}</h3><p className="mut">{user.name}</p></div></div>
   <div className="row" style={{margin:'.7rem 0'}}><span className="badge">{inr(f.amt)}</span><span className="badge">{f.dl||'No deadline'}</span><span className="badge">{f.cat}</span></div>
   <p className="mut">{f.desc||'Description appears here.'}</p><ul className="chk"><li className="p">Min marks: {f.pct||0}%</li><li className="p">Max income: {inr(f.inc)}</li><li className="p">{f.course} · Year {f.year} · {f.state}</li></ul>
   <p className="note">Documents: {[...L(f.req),...L(f.opt)].length} listed</p></div></div></div>}</>;
}

/* ================= Admin ================= */
function Admin(){
 const {S,A,U,C,stats,ask,act}=useC();const [t,setT]=useState('over'),[q,setQ]=useState(''),[nc,setNc]=useState('');
 const m=x=>String(x||'').toLowerCase().includes(q.toLowerCase());
 const del=(title,fn)=>ask({title,danger:1,ok:'Delete',body:<p>This cannot be undone.</p>,onOk:fn});
 const st=stats||{students:0,providers:0,scholarships:0,applications:0,by_status:{},by_category:{}};
 const UT=r=><div className="card"><div className="row" style={{marginBottom:'.8rem'}}><Search v={q} set={setQ}/></div><div className="tw"><table><thead><tr><th>Name</th><th>Email</th><th>{r=='student'?'Applications':'Scholarships'}</th><th>Status</th><th></th></tr></thead><tbody>{U.filter(u=>u.r==r&&(m(u.n)||m(u.e))).map(u=><tr key={u.id}><td>{u.n}</td><td className="mut">{u.e}</td><td>{r=='student'?A.filter(a=>a.who==u.n).length:S.filter(s=>s.by==u.n).length}</td><td><Badge s={u.blocked?'Blocked':'Active'}/></td>
  <td><div className="row"><button className="btn alt sm" onClick={()=>act(()=>api('/api/admin/users/'+u.id+'/block','POST'),u.blocked?'Unblocked':'Blocked')}>{u.blocked?'Unblock':'Block'}</button><button className="btn red sm" onClick={()=>del('Delete '+u.n+'?',()=>act(()=>api('/api/admin/users/'+u.id,'DELETE'),'User deleted'))}>Delete</button></div></td></tr>)}</tbody></table></div></div>;
 return <><h1 className="pt">Admin panel</h1>
 <Tabs v={t} set={x=>{setT(x);setQ('')}} items={[['over','Overview'],['stu','Students'],['prov','Providers'],['sch','Scholarships'],['app','Applications'],['cat','Categories']]}/>
 {t=='over'&&<><div className="grid">{[['Students',st.students],['Providers',st.providers],['Scholarships',st.scholarships],['Applications',st.applications]].map(([k,n])=><div className="card" key={k}><div className="num"><Count n={n}/></div>{k}</div>)}</div>
  <div className="g2"><div className="card"><h3>Applications by status</h3><Bars data={['Submitted','Under Review','Approved','Rejected'].map((k,i)=>[k,st.by_status[k]||0,['#f6b93b','#4f63e6','#2fcf9f','#e5484d'][i]])}/></div>
  <div className="card"><h3>Scholarships by category</h3><Bars data={Object.entries(st.by_category).map(([c,n])=>[c,n,(COL[c]||['','#2a3a96'])[1]])}/></div></div>
  <p className="note" style={{color:'#9aa5d6'}}>To reset all data: stop the server, delete scholarship.db, run python app.py again.</p></>}
 {t=='stu'&&UT('student')}{t=='prov'&&UT('provider')}
 {t=='sch'&&<div className="card"><div className="row" style={{marginBottom:'.8rem'}}><Search v={q} set={setQ}/></div><div className="tw"><table><thead><tr><th>Name</th><th>Provider</th><th>Category</th><th>Status</th><th></th></tr></thead><tbody>{S.filter(s=>m(s.name)||m(s.by)).map(s=><tr key={s.id}><td>{s.name}</td><td className="mut">{s.by}</td><td>{s.cat}</td><td><Badge s={s.st}/></td>
  <td><div className="row"><button className="btn alt sm" onClick={()=>act(()=>api('/api/scholarships/'+s.id+'/toggle','POST'),'Status changed')}>{s.st=='Active'?'Close':'Reopen'}</button><button className="btn red sm" onClick={()=>del('Delete scholarship?',()=>act(()=>api('/api/scholarships/'+s.id,'DELETE'),'Deleted'))}>Delete</button></div></td></tr>)}</tbody></table></div></div>}
 {t=='app'&&<div className="card"><div className="row" style={{marginBottom:'.8rem'}}><Search v={q} set={setQ} ph="Search student..."/></div><div className="tw"><table><thead><tr><th>Student</th><th>Scholarship</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>{A.filter(a=>m(a.who)).map(a=><tr key={a.id}><td>{a.who}</td><td>{(S.find(s=>s.id==a.sid)||{}).name}</td><td>{a.date}</td>
  <td><select style={{width:'auto'}} value={a.status} onChange={e=>act(()=>api('/api/applications/'+a.id+'/status','PUT',{status:e.target.value}),'Status updated')} aria-label="Status">{['Submitted','Under Review','Approved','Rejected'].map(x=><option key={x}>{x}</option>)}</select></td>
  <td><button className="btn red sm" onClick={()=>del('Delete application?',()=>act(()=>api('/api/applications/'+a.id,'DELETE'),'Deleted'))}>Delete</button></td></tr>)}</tbody></table></div></div>}
 {t=='cat'&&<div className="card"><h3>Manage categories</h3><div className="row" style={{margin:'1rem 0'}}>{C.map(c=><span key={c} className="chip on">{ICO[c]||'🎓'} {c} <button className="lnk" style={{color:'#fff',textDecoration:'none'}} aria-label={'Remove '+c} onClick={()=>del('Remove category '+c+'?',()=>act(()=>api('/api/categories/'+encodeURIComponent(c),'DELETE'),'Category removed'))}>✕</button></span>)}</div>
  <form className="row" onSubmit={async e=>{e.preventDefault();if(nc.trim()&&await act(()=>api('/api/categories','POST',{name:nc.trim()}),'Category added'))setNc('')}}><input style={{maxWidth:260}} placeholder="New category" value={nc} onChange={e=>setNc(e.target.value)} aria-label="New category"/><button className="btn sm">Add category</button></form></div>}</>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
